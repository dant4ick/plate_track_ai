name: plate_track_ai
description: "An app for tracking food nutrition using AI image recognition."
publish_to: 'none'

version: 0.3.0+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Camera and image handling
  camera: ^0.12.0+1
  image_picker: ^1.0.7
  image: ^4.5.4
  path_provider: ^2.1.3
  path: ^1.9.0
  
  # AI and machine learning
  tflite_flutter: ^0.12.1
  
  # State management
  provider: ^6.1.2
  
  # UI components
  fl_chart: ^1.0.0
  google_fonts: ^8.0.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Barcode scanning
  mobile_scanner: ^7.2.0
  openfoodfacts: ^3.30.2

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  uuid: ^4.3.3
  
  # Localization
  easy_localization: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4

  # For in-memory Hive testing
  hive_test: ^1.0.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon_color.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/ml/
    - assets/translations/
